<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RINL Factory - Safety & Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-login-pattern d-flex justify-content-center align-items-center vh-100">

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="glass-panel p-5 pulse-glow" style="border-radius: 20px;">
                    <div class="mb-4">
                        <span class="fa-stack fa-3x mb-3">
                            <i class="fa-solid fa-circle fa-stack-2x text-glow-orange" style="color: rgba(255, 107, 0, 0.1);"></i>
                            <i class="fa-solid fa-industry fa-stack-1x" style="color: var(--safety-orange);"></i>
                        </span>
                        <h1 class="fw-bold text-glow-blue display-5 mb-2">RINL FACTORY</h1>
                        <p class="text-muted text-uppercase tracking-wider fs-6 mb-4" style="letter-spacing: 3px;">Safety & Management System</p>
                    </div>

                    <div class="p-3 bg-dark rounded border border-secondary mb-4 text-start">
                        <small class="text-glow-orange fw-bold d-block mb-1 text-center"><i class="fa-solid fa-circle-exclamation me-1"></i> CONTROL CORE STATE</small>
                        <p class="text-muted small m-0 text-center">Connected to H2 Database and Spring Boot Backend successfully.</p>
                    </div>

                    <div class="d-grid gap-3">
                        <a href="login.html" class="btn btn-steel-blue py-3"><i class="fa-solid fa-right-to-bracket me-2"></i>ACCESS CONTROL PANEL</a>
                        <a href="register.html" class="btn btn-steel-orange py-3"><i class="fa-solid fa-signature me-2"></i>REGISTER OPERATOR ID</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
